---
name: Publish Documentation

on:
  workflow_call:
    inputs:
      # This is the name of the regular artifact that should
      # be published to the gh-pages branch.
      artifact-name:
        type: string
        required: false
        default: html-docs


permissions:
  actions: read  # For downloading artifacts of other runs when called via workflow_run trigger
  contents: write

jobs:

  # The released docs are not versioned currently, only the latest ones are deployed.
  #
  # Versioning support would require either (better):
  #   * Rebuilding docs for all versions when a new release is made
  #   * Version selector support in `furo`: https://github.com/pradyunsg/furo/pull/500
  #
  # The generated documentation replaces the root of the gh-pages branch.
  # Content managed separately under /repo is preserved during the sync.

  Deploy-Docs-GH-Pages:
    name: Publish Docs to gh-pages

    # A branch push cannot be concurrent: one deployment must finish before
    # another one snapshots and updates the branch.
    concurrency:
      group: gh-pages-publication
      cancel-in-progress: false

    runs-on: ubuntu-24.04

    steps:

      - name: Download built docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: html-docs
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}

      - name: Check out gh-pages
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update gh-pages
        run: |
          rsync -a --delete --exclude='/.git/' --exclude='/repo/' html-docs/ gh-pages/
          # GitHub Pages otherwise runs Jekyll, which omits directories such
          # as Sphinx's _static from the published site.
          touch gh-pages/.nojekyll
          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gh-pages add --all
          if ! git -C gh-pages diff --cached --quiet; then
            git -C gh-pages commit -m "Update documentation"
            git -C gh-pages push origin HEAD:gh-pages
          fi

      - name: Save Exit Status
        if: always()
        env:
          OUTFILE: exitstatus/${{ github.job }}
          STATUS: ${{ job.status }}
        run: |
          mkdir exitstatus
          echo "$STATUS" > "$OUTFILE"

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus
          if-no-files-found: error
